<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment - Vitality Clinic</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
        }

        .header {
            background: #0d4f49;
            color: white;
            padding: 20px 60px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 70%;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0d4f49;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #d9b85b;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #caa947;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Vitality Clinic</h1>
    </div>

    <div class="container">

        <h2>Book Your Appointment</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-btn">
                Book Appointment
            </button>

        </form>

    </div>

</body>
</html>
