<!DOCTYPE html>
<html>
<head>
    <title>Write Review - Vitality Clinic</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8f7;
            padding: 40px;
        }

        .review-container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #0d625d;
            text-align: center;
        }

        .doctor-name {
            text-align: center;
            margin-bottom: 25px;
            font-size: 18px;
        }

        label {
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #0d625d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #094b47;
        }
    </style>
    <div class="review-container">

    <h2>Write a Review</h2>
    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Review
        </button>
    </form>

</div>

</head>

<body>
</htm>
